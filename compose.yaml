# Environnement de développement ContextVault (BC-03.2).
#
#   docker compose up --build
#
# - serveur MCP : http://localhost:8080/mcp  (sondes /healthz et /readyz)
# - Keycloak    : http://localhost:8081  (admin / admin ; utilisateurs alice / alice et bob / bob)
#
# Réservé au développement : CONTEXTVAULT_ENV=development autorise le transport
# HTTP sans authentification tant que BC-10 n'est pas livré.

name: contextvault-dev

x-contextvault: &contextvault
  build:
    context: .
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
  image: contextvault:dev
  environment: &contextvault-env
    CONTEXTVAULT_ENV: development
    CONTEXTVAULT_LOG_LEVEL: ${CONTEXTVAULT_LOG_LEVEL:-info}
    CONTEXTVAULT_CONFIG: /etc/contextvault/vaults.config.json
    CONTEXTVAULT_INDEX_DIR: /var/lib/contextvault/index
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  indexer:
    <<: *contextvault
    command: ['node', 'packages/indexer/dist/bin.js']
    volumes:
      - ./dev/vaults.config.json:/etc/contextvault/vaults.config.json:ro
      - ./dev/vaults:/srv/vaults:ro
      - index:/var/lib/contextvault/index

  server:
    <<: *contextvault
    depends_on:
      - indexer
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./dev/vaults.config.json:/etc/contextvault/vaults.config.json:ro
      # Lecture seule aussi au niveau du système de fichiers (ET-02).
      - index:/var/lib/contextvault/index:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4}
    command: ['start-dev', '--import-realm', '--http-port=8081']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro

volumes:
  index:
